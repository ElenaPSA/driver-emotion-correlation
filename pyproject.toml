[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-emotion-correlation"
version = "0.1.0"
description = "Collect and analyze associations between driver emotions and driving signals"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "paho-mqtt>=2.1,<3",
    "websockets>=12,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
driver-emotion-correlation = "driver_emotion_correlation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
